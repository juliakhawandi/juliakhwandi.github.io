<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JK Portfolio</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			height: 100vh;
			display: flex;
			flex-direction: column;
			font-family: sans-serif;
		}

		.pdf-container {
			flex: 1;
			width: 100%;
			overflow: hidden;
			position: relative;
		}

		.pdf-container iframe {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: none;
		}

		header {
			padding: 1rem;
			text-align: center;
			background-color: #f0f0f0;
			font-size: 1.25rem;
		}
	</style>
</head>
<body>

	<header>
		Julia Khawandi – Portfolio
	</header>

	<div class="pdf-container">
		<iframe src="src/Julia-Khawandi-Portfolio.pdf" type="application/pdf"></iframe>
	</div>

</body>
</html>
